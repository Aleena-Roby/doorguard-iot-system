; PlatformIO Project Configuration File for DoorGuard ESP32
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor speed matching firmware Serial.begin(115200)
monitor_speed = 115200

; Upload speed
upload_speed = 921600

; Automatically detect or specify port (e.g. COM10 on Windows or /dev/ttyUSB0 on Linux)
; upload_port = COM10
; monitor_port = COM10

; Dependencies: ArduinoJson for structured JSON payloads
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

; Build flags
build_flags =
    -D CORE_DEBUG_LEVEL=0

