services:
  postgres:
    image: postgres:16-alpine
    container_name: doorguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: doorguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doorguard"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doorguard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/doorguard
      FLASK_ENV: development
      PORT: 5000
      CORS_ORIGINS: "*"
      ALERT_DEFAULT_THRESHOLD: "10"
      HEARTBEAT_TIMEOUT_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: doorguard_postgres_data

